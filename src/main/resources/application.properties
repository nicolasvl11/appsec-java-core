server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appsec}
spring.datasource.username=${DB_USER:appsec}
spring.datasource.password=${DB_PASS:appsec}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
# Disable Redis health indicator by default; enabled only when Redis is configured
management.health.redis.enabled=false


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.ratelimit.type=${RATELIMIT_TYPE:memory}
app.trusted-proxies=127.0.0.1,::1

# OAuth2 redirect URI sent to frontend after successful login
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# OAuth2 client registrations — replace placeholder values with real credentials in production
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:placeholder-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:placeholder-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175
# RSA-2048 key pair for JWT RS256 signing.
# Generate with: scripts/generate-jwt-keys.sh
# Set APP_JWT_PRIVATE_KEY and APP_JWT_PUBLIC_KEY in your environment or .env file.
app.jwt.private-key=${APP_JWT_PRIVATE_KEY}
app.jwt.public-key=${APP_JWT_PUBLIC_KEY}
app.jwt.expiration-ms=900000

# Throw NoHandlerFoundException for unknown routes so GlobalExceptionHandler can produce ProblemDetail
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
